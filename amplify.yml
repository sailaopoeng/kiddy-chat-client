version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # VITE_API_URL must be set under Hosting > Environment variables.
        # The build fails with a clear message if it is missing.
        - echo "Building against API at $VITE_API_URL"
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
