version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - echo "Building with environment variables:"
        - echo "VITE_API_URL=$VITE_API_URL"
        - echo "VITE_API_TIMEOUT=$VITE_API_TIMEOUT"
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
  environment:
    variables:
      VITE_API_URL: http://localhost:3001
      VITE_API_TIMEOUT: 30000
